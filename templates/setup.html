<!DOCTYPE html>
<html lang="en">
<head>
    <title>Creator Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>body { background-color: #050505; color: #f4f4f5; }</style>
</head>
<body class="min-h-screen flex items-center justify-center p-6 font-sans relative selection:bg-orange-500/30">
    <div class="fixed top-[-10%] right-[-10%] w-[30vw] h-[30vw] bg-orange-600/10 rounded-full blur-[120px]"></div>

    <div class="relative z-10 bg-zinc-900/50 backdrop-blur-3xl border border-white/10 p-10 rounded-3xl shadow-2xl max-w-4xl w-full">
        <h2 class="text-3xl font-bold mb-8 text-transparent bg-clip-text bg-gradient-to-r from-white to-zinc-500">Initialize Profile</h2>
        
        <form method="POST" action="/" enctype="multipart/form-data" class="grid grid-cols-1 md:grid-cols-2 gap-8">
            
            <div class="space-y-5">
                <div>
                    <label class="block text-xs font-semibold text-zinc-400 uppercase tracking-wider mb-2">Username</label>
                    <input type="text" name="username" placeholder="mnvchauhan" class="w-full bg-[#111] border border-white/5 rounded-xl p-3 text-white focus:border-orange-500 outline-none" required>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-zinc-400 uppercase tracking-wider mb-2">Display Name</label>
                    <input type="text" name="name" placeholder="Manav Chauhan" class="w-full bg-[#111] border border-white/5 rounded-xl p-3 text-white focus:border-orange-500 outline-none" required>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-zinc-400 uppercase tracking-wider mb-2">UPI ID</label>
                    <input type="text" name="upi_id" placeholder="mnv@okaxis" class="w-full bg-[#111] border border-white/5 rounded-xl p-3 text-white focus:border-orange-500 outline-none" required>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-zinc-400 uppercase tracking-wider mb-2">Profile Picture</label>
                    <input type="file" name="profile_pic" accept="image/*" class="w-full bg-[#111] border border-white/5 rounded-xl p-2.5 text-sm text-zinc-400 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-xs file:font-semibold file:bg-white/10 file:text-white hover:file:bg-white/20 transition-all cursor-pointer outline-none">
                </div>
            </div>

            <div class="space-y-5">
                <div>
                    <label class="block text-xs font-semibold text-zinc-400 uppercase tracking-wider mb-2">Bio</label>
                    <textarea name="bio" rows="2" placeholder="I build robust backends..." class="w-full bg-[#111] border border-white/5 rounded-xl p-3 text-white focus:border-orange-500 outline-none resize-none" required></textarea>
                </div>
                
                <div class="grid grid-cols-2 gap-4 pt-2">
                    <div>
                        <label class="block text-[10px] font-bold text-zinc-500 uppercase tracking-wider mb-1.5">Website</label>
                        <input type="url" name="website" placeholder="https://..." class="w-full bg-[#111] border border-white/5 rounded-lg p-2.5 text-sm text-white focus:border-emerald-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-zinc-500 uppercase tracking-wider mb-1.5">GitHub</label>
                        <input type="url" name="github" placeholder="URL" class="w-full bg-[#111] border border-white/5 rounded-lg p-2.5 text-sm text-white focus:border-white outline-none">
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-zinc-500 uppercase tracking-wider mb-1.5">LinkedIn</label>
                        <input type="url" name="linkedin" placeholder="URL" class="w-full bg-[#111] border border-white/5 rounded-lg p-2.5 text-sm text-white focus:border-blue-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-zinc-500 uppercase tracking-wider mb-1.5">Instagram</label>
                        <input type="url" name="instagram" placeholder="URL" class="w-full bg-[#111] border border-white/5 rounded-lg p-2.5 text-sm text-white focus:border-pink-500 outline-none">
                    </div>
                </div>
            </div>

            <div class="col-span-1 md:col-span-2 mt-2">
                <button type="submit" class="w-full bg-white text-black font-bold py-4 rounded-xl hover:bg-zinc-200 transition-all shadow-lg hover:shadow-white/20 hover:-translate-y-0.5">Deploy Profile 🚀</button>
            </div>
        </form>
    </div>
</body>
</html>
