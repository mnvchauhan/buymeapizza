<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Support Developer</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <style>
        body { background-color: #050505; color: #f4f4f5; }
        /* Premium Glassmorphism Effect */
        .glass-card {
            background: rgba(24, 24, 27, 0.4);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6 relative font-sans overflow-hidden">
    
    <div class="absolute top-[-10%] left-[-10%] w-[500px] h-[500px] bg-orange-600/20 rounded-full filter blur-[120px] opacity-60 pointer-events-none"></div>
    <div class="absolute bottom-[-10%] right-[-10%] w-[500px] h-[500px] bg-blue-600/20 rounded-full filter blur-[120px] opacity-60 pointer-events-none"></div>

    <div class="glass-card relative z-10 p-8 rounded-[2rem] max-w-md w-full">
        
        <div id="setupView">
            <div class="flex justify-center mb-6">
                <div class="h-12 w-12 rounded-2xl bg-zinc-800 border border-white/5 flex items-center justify-center text-orange-500 text-2xl shadow-inner">⚡</div>
            </div>
            <h2 class="text-2xl font-bold mb-6 text-center text-transparent bg-clip-text bg-gradient-to-r from-white to-zinc-500">Configure Payouts</h2>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-zinc-400 uppercase tracking-wider mb-1">Creator Name</label>
                    <input type="text" id="nameInput" value="Manav Chauhan" class="w-full bg-black/50 border border-white/10 rounded-2xl p-4 text-white outline-none focus:border-orange-500/50 transition-colors">
                </div>
                <div>
                    <label class="block text-xs font-medium text-zinc-400 uppercase tracking-wider mb-1">UPI ID</label>
                    <input type="text" id="upiInput" placeholder="e.g., mnv@okaxis" class="w-full bg-black/50 border border-white/10 rounded-2xl p-4 text-white outline-none focus:border-orange-500/50 transition-colors">
                </div>
                <button onclick="saveProfile()" class="w-full bg-white text-black font-semibold py-4 rounded-2xl mt-4 hover:scale-[1.02] transition-transform">Save & Initialize</button>
            </div>
        </div>

        <div id="menuView" class="hidden">
            <div class="text-center mb-8">
                <h1 class="text-3xl font-bold mb-2 text-transparent bg-clip-text bg-gradient-to-r from-white to-zinc-400" id="displayName"></h1>
                <p class="text-zinc-500 text-sm font-medium">Support my next build.</p>
            </div>

            <div class="space-y-3 mb-6" id="menuOptions"></div>

            <div id="qrContainer" class="hidden flex flex-col items-center mt-4">
                <div class="bg-white p-4 rounded-2xl mb-3">
                    <div id="qrcode"></div>
                </div>
                <p class="text-sm text-zinc-400 mb-6">Scan to pay <span class="text-white font-bold" id="displayAmount"></span></p>
            </div>

            <button onclick="resetProfile()" class="w-full text-zinc-500 text-sm hover:text-white transition-colors">← Edit Profile</button>
        </div>
    </div>

    <script>
        const menu = [
            { id: 1, name: 'Mini Slice', price: 49, icon: '🍕' },
            { id: 2, name: 'Pro Dev Meal', price: 99, icon: '⚡' },
            { id: 3, name: 'God Mode Feast', price: 199, icon: '✨' }
        ];

        let upiId = '';
        let creatorName = '';
        let qrCodeObj = null;

        function saveProfile() {
            upiId = document.getElementById('upiInput').value;
            creatorName = document.getElementById('nameInput').value;

            if (!upiId.includes('@')) {
                alert("Please enter a valid UPI ID");
                return;
            }

            document.getElementById('displayName').innerText = creatorName;
            document.getElementById('setupView').classList.add('hidden');
            document.getElementById('menuView').classList.remove('hidden');
            renderMenu();
        }

        function resetProfile() {
            document.getElementById('menuView').classList.add('hidden');
            document.getElementById('setupView').classList.remove('hidden');
            document.getElementById('qrContainer').classList.add('hidden');
        }

        function renderMenu() {
            const container = document.getElementById('menuOptions');
            container.innerHTML = ''; // Clear old buttons
            
            menu.forEach(item => {
                const btn = document.createElement('button');
                btn.className = 'w-full flex items-center justify-between p-4 rounded-2xl border bg-black/30 border-white/5 hover:border-white/10 transition-all text-left';
                btn.innerHTML = `<span class="text-base">${item.icon} &nbsp; ${item.name}</span><span class="font-bold text-zinc-300">₹${item.price}</span>`;
                btn.onclick = () => generateQR(item.price, btn);
                container.appendChild(btn);
            });
        }

        function generateQR(amount, selectedBtn) {
            // Reset button highlights
            const buttons = document.getElementById('menuOptions').children;
            for(let b of buttons) {
                b.classList.remove('bg-orange-500/10', 'border-orange-500/50');
                b.classList.add('bg-black/30', 'border-white/5');
            }
            // Highlight clicked button
            selectedBtn.classList.remove('bg-black/30', 'border-white/5');
            selectedBtn.classList.add('bg-orange-500/10', 'border-orange-500/50');

            // Show QR container
            document.getElementById('qrContainer').classList.remove('hidden');
            document.getElementById('displayAmount').innerText = `₹${amount}`;

            // Generate UPI Link
            const upiLink = `upi://pay?pa=${upiId}&pn=${creatorName}&am=${amount}&cu=INR`;

            // Render QR Code
            if (qrCodeObj == null) {
                qrCodeObj = new QRCode(document.getElementById("qrcode"), {
                    text: upiLink,
                    width: 160,
                    height: 160,
                    colorDark : "#050505",
                    colorLight : "#ffffff",
                    correctLevel : QRCode.CorrectLevel.H
                });
            } else {
                qrCodeObj.clear();
                qrCodeObj.makeCode(upiLink);
            }
        }
    </script>
</body>
</html>
